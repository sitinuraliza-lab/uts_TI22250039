
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Penyewaan Mobil</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="rental-page">

    <main>

        <section>
            <h2>Form Penyewaan Mobil</h2>
            <p>Silakan isi data penyewaan Anda.</p>

            <form id="formPenyewaan" class="booking-form">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama"
                        name="nama" required>
                </div>

                <div class="form-group">
                    <label for="mobil">Pilihan Mobil</label>
                    <select id="mobil" name="mobil" required>
                        <option value="">Pilih Mobil</option>
                        <option value="BMW M4 Competition 039">BMW M4 Competition 039</option>
                        <option value="Lamborghini Revuelto 039">Lamborghini Revuelto 039</option>
                        <option value="Porsche 911 Turbo 039">Porsche 911 Turbo 039</option>
                        <option value="Rolls-Royce Ghost 039">Rolls-Royce Ghost 039</option>
                        <option value="Bugatti Chiron 039">Bugatti Chiron 039</option>
                        <option value="Ferrari SF90 039">Ferrari SF90 039</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lama">Lama Sewa (Hari)</label>
                    <input type="number" id="lama"
                        name="lama" min="1" value="1" required>
                </div>

                <button type="submit" class="btn-primary">
                    Sewa Sekarang
                </button>

            </form>
        </section>

    </main>

    <div id="success-overlay" class="success-overlay">

        <div id="success-container" class="success-card">

            <h2>🎉 PENYEWAAN BERHASIL!</h2>

            <p>Terima kasih telah menggunakan layanan kami!</p>

            <div class="summary-details">

                <p>
                    <strong>Nama Penyewa:</strong>
                    <span id="res-nama"></span>
                </p>

                <p>
                    <strong>Mobil:</strong>
                    <span id="res-mobil"></span>
                </p>

                <p>
                    <strong>Lama Sewa:</strong>
                    <span id="res-lama"></span> Hari
                </p>

                <p>
                    <strong>Harga Per Hari:</strong>
                    <span id="res-harga"></span>
                </p>

                <p>
                    <strong>Total Pembayaran:</strong>
                    <span id="res-total"></span>
                </p>

            </div>

            <button type="button" class="btn-ok" onclick="resetForm()">
                OKE
            </button>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
